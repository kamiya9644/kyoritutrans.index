<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運送作業報告</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --main-color: #2c3e50; --accent-color: #3498db; }
        body { font-family: 'Noto Sans JP', sans-serif; padding: 20px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:required { border-left: 5px solid #e74c3c; } /* 必須項目を強調 */
        .btn-submit { width: 100%; padding: 16px; background: var(--main-color); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:disabled { background: #bdc3c7; }
        .btn-add-via { background: #ecf0f1; border: 1px dashed #bdc3c7; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .via-point-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .btn-remove { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <form id="reportForm" class="card">
        <h2 style="text-align:center; margin-top:0;">作業報告入力</h2>
        
        <div class="form-group">
            <label>積日</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>請求先（客先名）</label>
            <select id="store_id" onchange="toggleQuantityField()" required>
                <option value="">選択してください</option>
            </select>
        </div>

        <div class="form-group">
            <label id="via_label">経由地 (任意)</label>
            <div id="viaPointsContainer"></div>
            <button type="button" class="btn-add-via" id="add_via_btn" onclick="addViaPoint()">＋ 経由地を追加する</button>
        </div>

        <div class="form-group" id="quantity_group" style="display:none;">
            <label>件数（点数）</label>
            <input type="number" id="quantity" placeholder="例: 7">
        </div>

        <div class="form-group">
            <label>積込先</label>
            <input type="text" id="loading_point" placeholder="例: 岬" required>
        </div>

        <div class="form-group">
            <label>納品先</label>
            <input type="text" id="delivery_point" placeholder="例: 泉大津" required>
        </div>

        <div class="form-group">
            <label>備考</label>
            <textarea id="remarks" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">報告を送信する</button>
    </form>

    <script>
        const WEB_APP_URL = "あなたのGAS_API_URL"; 
        const WEBHOOK_URL = "あなたのMake_Webhook_URL";

        async function main() {
            try {
                await liff.init({ liffId: "あなたのLIFF_ID" });
                if (!liff.isLoggedIn()) { liff.login(); }
                document.getElementById('date').valueAsDate = new Date();
                loadStores();
            } catch (err) { console.error(err); }
        }

        async function loadStores() {
            const res = await fetch(WEB_APP_URL);
            const stores = await res.json();
            const select = document.getElementById('store_id');
            stores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id; opt.text = s.name;
                select.appendChild(opt);
            });
        }

        function toggleQuantityField() {
            const storeId = document.getElementById('store_id').value;
            const qGroup = document.getElementById('quantity_group');
            const qInput = document.getElementById('quantity');
            const vLabel = document.getElementById('via_label');
            const vBtn = document.getElementById('add_via_btn');
            const viaInputs = document.querySelectorAll('.via-input');

            // S001(ロジックワークス)判定
            if (storeId === 'S001') {
                vLabel.innerText = "荷主 (必須)"; 
                vBtn.innerText = "＋ 荷主を追加する";
                // 既に欄がある場合は必須にする。欄がなければ1つ追加。
                if (viaInputs.length === 0) {
                    addViaPoint();
                } else {
                    viaInputs.forEach(input => input.required = true);
                }
            } else {
                vLabel.innerText = "経由地 (任意)"; 
                vBtn.innerText = "＋ 経由地を追加する";
                viaInputs.forEach(input => input.required = false);
            }

            // S002(収集運搬)判定
            if (storeId === 'S002') {
                qGroup.style.display = 'block';
                qInput.required = true;
            } else {
                qGroup.style.display = 'none';
                qInput.required = false;
                qInput.value = "";
            }
        }

        function addViaPoint() {
            const container = document.getElementById('viaPointsContainer');
            const storeId = document.getElementById('store_id').value;
            const isLogicWorks = (storeId === 'S001');

            const div = document.createElement('div');
            div.className = 'via-point-item';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'via-input';
            input.placeholder = isLogicWorks ? '荷主名を入力' : '経由地を入力';
            if (isLogicWorks) input.required = true;

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'btn-remove';
            removeBtn.innerText = '削除';
            removeBtn.onclick = () => {
                div.remove();
                // 必須の場合、最低一つは残す等の制御が必要ならここに追加
            };

            div.appendChild(input);
            div.appendChild(removeBtn);
            container.appendChild(div);
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // デフォルトの送信を防止
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "送信中...";

            try {
                const profile = await liff.getProfile();
                const viaInputs = document.querySelectorAll('.via-input');
                const viaPointsString = Array.from(viaInputs).map(i => i.value.trim()).filter(v => v).join('、');

                const data = {
                    userId: profile.userId,
                    userName: profile.displayName,
                    date: document.getElementById('date').value,
                    storeId: document.getElementById('store_id').value,
                    quantity: document.getElementById('quantity').value || 1,
                    loadingPoint: document.getElementById('loading_point').value,
                    viaPoints: viaPointsString,
                    deliveryPoint: document.getElementById('delivery_point').value,
                    remarks: document.getElementById('remarks').value
                };

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) { 
                    alert("報告を送信しました。"); 
                    liff.closeWindow(); 
                } else { 
                    alert("送信に失敗しました。"); 
                    submitBtn.disabled = false; 
                    submitBtn.innerText = "報告を送信する"; 
                }
            } catch (err) { 
                alert("エラー: " + err.message); 
                submitBtn.disabled = false; 
                submitBtn.innerText = "報告を送信する";
            }
        });

        main();
    </script>
</body>
</html>
