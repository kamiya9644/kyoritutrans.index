<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運送作業報告 (複数セット対応)</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --main-color: #2c3e50; --accent-color: #3498db; --danger-color: #e74c3c; }
        body { font-family: 'Noto Sans JP', sans-serif; padding: 15px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        /* 必須項目の強調 */
        input:required, select:required { border-left: 5px solid var(--danger-color); }

        /* 運行セットのスタイル */
        .work-set { border: 2px solid #e0e6ed; padding: 15px; border-radius: 10px; margin-bottom: 20px; background: #ffffff; position: relative; }
        .work-set-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .set-title { font-weight: bold; color: var(--main-color); font-size: 16px; }
        .btn-remove-set { background: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        .btn-add-set { background: white; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
        
        .via-point-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-remove-via { background: #95a5a6; color: white; border: none; border-radius: 4px; padding: 0 12px; cursor: pointer; }
        .btn-add-via { background: none; border: 1px dashed var(--accent-color); color: var(--accent-color); width: 100%; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; font-weight: bold; }

        .btn-submit { width: 100%; padding: 18px; background: var(--main-color); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background: #bdc3c7; }
    </style>
</head>
<body>
    <form id="reportForm">
        <div class="card">
            <h2 style="text-align:center; margin:0 0 15px 0; font-size: 20px;">作業報告入力</h2>
            <div class="form-group"><label>積日</label><input type="date" id="date" required></div>
            <div class="form-group">
                <label>客先</label>
                <select id="store_id" onchange="syncAllSets()" required>
                    <option value="">リスト取得中...</option>
                </select>
            </div>
        </div>

        <div id="setsContainer"></div>
        
        <button type="button" class="btn-add-set" onclick="addWorkSet()">＋ 別の運行を追加する</button>

        <div class="card">
            <div class="form-group"><label>全体の備考</label><textarea id="remarks" rows="2" placeholder="特記事項があれば入力"></textarea></div>
            <button type="submit" class="btn-submit" id="submitBtn">報告を送信する</button>
        </div>
    </form>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxi2V8irtsST4AYwS_3udOJLJzMrgt2Y2ibJoOKXdKGDDCj77BCoY9uueyhrxPnt-oH/exec";
        const WEBHOOK_URL = "https://hook.eu1.make.com/7wchwrambaxlegy4h1hy8mxbpqh6orxv";
        const LIFF_ID = "2009014587-Ej7Q1Xaq";

        let setCounter = 0;

        // 運行セットの追加
        function addWorkSet() {
            setCounter++;
            const container = document.getElementById('setsContainer');
            const div = document.createElement('div');
            div.className = 'work-set';
            div.id = `work_set_row_${setCounter}`;
            div.innerHTML = `
                <div class="work-set-header">
                    <span class="set-title">運行内容</span>
                    <button type="button" class="btn-remove-set" onclick="removeSet('${div.id}')">削除</button>
                </div>
                <div class="form-group"><label>積込先</label><input type="text" class="loading_point" placeholder="例：芝浦" required></div>
                <div class="form-group">
                    <label class="via_label">経由地 (任意)</label>
                    <div class="viaPointsList"></div>
                    <button type="button" class="btn-add-via" onclick="addViaPointToSet(this)">＋ 経由地/荷主を追加</button>
                </div>
                <div class="form-group"><label>納品先</label><input type="text" class="delivery_point" placeholder="例：横浜" required></div>
                <div class="form-group quantity_group" style="display:none;">
                    <label>件数 (S002専用)</label>
                    <input type="number" class="quantity" min="1" placeholder="例：1">
                </div>
            `;
            container.appendChild(div);
            syncAllSets(); 
            updateRemoveButtons();
        }

        function removeSet(elementId) {
            const el = document.getElementById(elementId);
            if (el) el.remove();
            updateRemoveButtons();
        }

        // セットが1つだけの時は削除ボタンを隠す
        function updateRemoveButtons() {
            const sets = document.querySelectorAll('.work-set');
            sets.forEach(set => {
                const btn = set.querySelector('.btn-remove-set');
                btn.style.display = (sets.length === 1) ? 'none' : 'block';
            });
        }

        // 経由地/荷主の削除処理（S001の場合は最後の一つを消させない）
        function removeViaPoint(btn) {
            const item = btn.parentElement;
            const list = item.parentElement;
            const storeId = document.getElementById('store_id').value;
            
            if (storeId === 'S001' && list.querySelectorAll('.via-point-item').length <= 1) {
                alert("荷主は1つ以上入力してください。");
                return;
            }
            item.remove();
        }

        function addViaPointToSet(btn) {
            const list = btn.previousElementSibling;
            const storeId = document.getElementById('store_id').value;
            const isLogicWorks = (storeId === 'S001');

            const div = document.createElement('div');
            div.className = 'via-point-item';
            div.innerHTML = `
                <input type="text" class="via-input" placeholder="${isLogicWorks ? '荷主名を入力' : '経由地を入力'}" ${isLogicWorks ? 'required' : ''}>
                <button type="button" class="btn-remove-via" onclick="removeViaPoint(this)">×</button>
            `;
            list.appendChild(div);
        }

        function syncAllSets() {
            const storeId = document.getElementById('store_id').value;
            const sets = document.querySelectorAll('.work-set');
            
            sets.forEach(set => {
                const viaLabel = set.querySelector('.via_label');
                const qGroup = set.querySelector('.quantity_group');
                const qInput = set.querySelector('.quantity');

                if (storeId === 'S001') {
                    viaLabel.innerText = "荷主 (必須)";
                    if (set.querySelectorAll('.via-point-item').length === 0) {
                        addViaPointToSet(set.querySelector('.btn-add-via'));
                    }
                    set.querySelectorAll('.via-input').forEach(i => i.required = true);
                } else {
                    viaLabel.innerText = "経由地 (任意)";
                    set.querySelectorAll('.via-input').forEach(i => i.required = false);
                }

                qGroup.style.display = (storeId === 'S002') ? 'block' : 'none';
                qInput.required = (storeId === 'S002');
            });
        }

        async function fetchStores() {
            try {
                const response = await fetch(GAS_API_URL);
                const stores = await response.json();
                const select = document.getElementById('store_id');
                select.innerHTML = '<option value="">選択してください</option>';
                stores.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id; opt.textContent = `${s.name} (${s.id})`;
                    select.appendChild(opt);
                });
            } catch (err) { console.error(err); }
        }

        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                document.getElementById('date').valueAsDate = new Date();
                await fetchStores();
                addWorkSet(); 
            } catch (err) { console.error(err); }
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "送信中...";

            try {
                const profile = await liff.getProfile();
                const date = document.getElementById('date').value;
                const storeId = document.getElementById('store_id').value;
                const commonRemarks = document.getElementById('remarks').value;

                const payloadArray = Array.from(document.querySelectorAll('.work-set')).map(set => {
                    const viaInputs = set.querySelectorAll('.via-input');
                    const viaList = Array.from(viaInputs).map(i => i.value.trim()).filter(v => v).join('、');
                    return {
                        userId: profile.userId,
                        userName: profile.displayName,
                        date: date,
                        storeId: storeId,
                        loadingPoint: set.querySelector('.loading_point').value,
                        viaPoints: viaList,
                        deliveryPoint: set.querySelector('.delivery_point').value,
                        quantity: set.querySelector('.quantity').value || 1,
                        remarks: commonRemarks
                    };
                });

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadArray)
                });

                if (response.ok) {
                    alert("すべての運行報告を完了しました。");
                    liff.closeWindow();
                } else {
                    throw new Error("送信に失敗しました。Makeの設定を確認してください。");
                }
            } catch (err) {
                alert(err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "報告を送信する";
            }
        });

        main();
    </script>
</body>
</html>
